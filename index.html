    <script>
      (function () {
        try {
          var t = localStorage.getItem('lednique-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
          var L = ['ru', 'en', 'zh', 'ja', 'pt', 'fr', 'ar'];
          var savedLang = localStorage.getItem('lednique-lang');
          var nav = (navigator.languages || [navigator.language || 'ru']).map(function (x) {
            return String(x).toLowerCase().slice(0, 2);
          });
          var lang =
            L.indexOf(savedLang) >= 0
              ? savedLang
              : nav.find(function (c) {
                  return L.indexOf(c) >= 0;
                }) || 'ru';
          document.documentElement.lang = lang;
          document.documentElement.dataset.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
