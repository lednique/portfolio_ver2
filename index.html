<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LEDNIQUE — Portfolio</title>
    <link rel="icon" href="./assets/app-Dez4hyYC.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lednique-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/app-B_c9T7z6.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/app-BM4Nosjs.css">
  </head>

    <div id="root"></div>
    <script src="./shader.js" defer></script>
  </body>
</html>
