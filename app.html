<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>lednique – portfolio</title>
    <link rel="icon" href="./assets/logo.png" />
    <meta name="description" content="Виктор Власов (lednique) — графический дизайн, AI-продакшн, AR-эффекты и e-commerce. 12+ лет практики, кейсы и контакты." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="lednique – portfolio" />
    <meta property="og:url" content="https://portfolio.lednique.ru/" />
    <meta property="og:description" content="Графический дизайн, AI-продакшн, AR-эффекты и e-commerce." />
    <meta property="og:image" content="https://portfolio.lednique.ru/assets/poster/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="image" href="./assets/figma/_dc/hero/6b2c4945dd833d20a742b69906ddc84fe182b8cb.webp" fetchpriority="high" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lednique-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
          var L = ['ru', 'en', 'zh', 'ja', 'pt', 'fr', 'ar'];
          var savedLang = localStorage.getItem('lednique-lang');
          var nav = (navigator.languages || [navigator.language || 'ru']).map(function (x) {
            return String(x).toLowerCase().slice(0, 2);
          });
          var lang =
            L.indexOf(savedLang) >= 0
              ? savedLang
              : nav.find(function (c) {
                  return L.indexOf(c) >= 0;
                }) || 'ru';
          document.documentElement.lang = lang;
          document.documentElement.dataset.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="./shader.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
